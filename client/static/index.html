<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSQL.APP minimal</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">TSQL.APP minimal</p>
      <h1 id="title">Menu</h1>
    </div>
    <p id="who"></p>
  </header>
  <div id="error" class="banner" hidden></div>
  <nav id="crumbs"></nav>
  <div id="toolbar"></div>
  <main id="screen"></main>
  <div id="toasts"></div>
  <div id="modal" class="modal-backdrop" hidden></div>
  <details id="json-wrap">
    <summary>JSON payload</summary>
    <pre id="json"></pre>
  </details>
  <script src="/app.js"></script>
</body>
</html>
